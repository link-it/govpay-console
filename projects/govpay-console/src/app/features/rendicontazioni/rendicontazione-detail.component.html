<section class="space-y-4 pb-6 lnk-detail-page">
  <div lnkListStickyToolbar class="px-6 pt-6 pb-4 space-y-3">
  <lnk-page-header [titleKey]="flusso()?.idFlusso || '—'" subtitleKey="Rendicontazioni.Detail.Subtitle">
    <a routerLink="/rendicontazioni" class="btn btn-secondary btn-sm">
      <ng-icon name="bootstrapChevronLeft" size="1rem" />
      <span>{{ 'Common.Back' | translate }}</span>
    </a>
    @if (flusso()) {
      <button type="button" class="btn btn-primary btn-sm" (click)="onDownloadXml()" [disabled]="downloading()">
        <ng-icon name="bootstrapDownload" size="1rem" />
        <span>{{ 'Rendicontazioni.Detail.ScaricaXml' | translate }}</span>
      </button>
    }
  </lnk-page-header>
    @if (flusso()) {
      <div class="flex items-center gap-2">
        <lnk-status-badge [tone]="statoTone()" [labelKey]="statoLabelKey()" />
      </div>
    }
  </div>

  <div class="px-6 space-y-6">

  @if (error()) {
    <lnk-empty-state
      icon="bootstrapExclamationTriangle"
      titleKey="Common.LoadError"
      [descriptionKey]="error()!"
    >
      <a routerLink="/rendicontazioni" class="btn btn-secondary btn-sm">{{ 'Common.Back' | translate }}</a>
    </lnk-empty-state>
  } @else if (loading() && !flusso()) {
    <lnk-loading />
  } @else if (flusso()) {

    <!-- Hero: importo totale colorato in base allo stato -->
    @if (importoFmt(); as imp) {
      <div [class]="'lnk-hero-card lnk-hero-' + statoTone()">
        <div class="lnk-hero-label">{{ 'Rendicontazioni.Detail.Importo' | translate }}</div>
        <div class="lnk-hero-value">{{ imp }}</div>
      </div>
    }

    <lnk-detail-section variant="plain" titleDivider titleKey="Rendicontazioni.Detail.Generali">
      <lnk-info-grid uniform [items]="generaliItems()" />
    </lnk-detail-section>

    <lnk-detail-section variant="plain" titleDivider titleKey="Rendicontazioni.Detail.EnteCreditore">
      <lnk-info-grid uniform [items]="enteItems()" />
    </lnk-detail-section>

    <lnk-detail-section variant="plain" titleDivider titleKey="Rendicontazioni.Detail.Psp">
      <lnk-info-grid uniform [items]="pspItems()" />
    </lnk-detail-section>
  }
  </div>
</section>
