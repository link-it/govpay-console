<section class="space-y-4 pb-6 lnk-detail-page">
  <div lnkListStickyToolbar class="px-6 pt-6 pb-4">
  <lnk-page-header [titleKey]="ruolo()?.idRuolo || '—'" subtitleKey="Ruoli.Detail.Subtitle">
    <div class="flex items-center gap-2">
      @if (ruolo(); as r) {
        <a [routerLink]="['/ruoli', r.idRuolo, 'modifica']" class="btn btn-primary btn-sm">
          <ng-icon name="bootstrapPencil" size="1rem" />
          <span>{{ 'Ruoli.Form.Modifica' | translate }}</span>
        </a>
      }
      <a routerLink="/ruoli" class="btn btn-secondary btn-sm">
        <ng-icon name="bootstrapChevronLeft" size="1rem" />
        <span>{{ 'Common.Back' | translate }}</span>
      </a>
    </div>
  </lnk-page-header>
  </div>

  <div class="px-6 space-y-4">

  @if (error()) {
    <lnk-empty-state icon="bootstrapExclamationTriangle" titleKey="Common.LoadError" [descriptionKey]="error()!">
      <a routerLink="/ruoli" class="btn btn-secondary btn-sm">{{ 'Common.Back' | translate }}</a>
    </lnk-empty-state>
  } @else if (loading() && !ruolo()) {
    <lnk-loading />
  } @else if (ruolo(); as r) {
    <lnk-detail-section titleKey="Ruoli.Detail.Generali">
      <lnk-info-grid [items]="generaliItems()" />
    </lnk-detail-section>
    <lnk-detail-section titleKey="Ruoli.Detail.Acl">
      @if (r.acl.length > 0) {
        <lnk-acl-editor [acl]="r.acl" [disabled]="true" />
      } @else {
        <p class="text-sm text-[var(--muted-foreground)]">{{ 'Ruoli.Detail.NoAcl' | translate }}</p>
      }
    </lnk-detail-section>
  }
  </div>
</section>
