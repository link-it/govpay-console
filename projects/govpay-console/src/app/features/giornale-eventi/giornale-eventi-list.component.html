<section class="space-y-4 pb-6 lnk-list-page">
  <div lnkListStickyToolbar class="px-6 pt-6 pb-4 space-y-4">
  <lnk-page-header titleKey="Nav.GiornaleEventi" subtitleKey="GiornaleEventi.Subtitle" [total]="total()" [loading]="loading() && rows().length === 0"
    [countOnRequest]="canShowCount()" [countLoading]="countLoading()" (requestCount)="requestCount()">
    <button type="button" class="btn btn-secondary btn-sm" (click)="refresh()" [disabled]="loading()">
      {{ 'Common.Refresh' | translate }}
    </button>
  </lnk-page-header>

  <!-- Barra di ricerca (search-pill @linkit/shared-ui). -->
  <div class="flex items-stretch gap-2">
    <lnk-search-pill class="flex-1 min-w-0"
      [fields]="searchFields()"
      [(value)]="searchState"
      [showSort]="false"
      [variant]="searchPillVariant()"
      [density]="searchPillDensity()"
      [labels]="pillLabels()"
      [placeholder]="searchPlaceholder()"
      (search)="onSearch($event)"
    />
    <lnk-view-toggle [value]="viewMode()" (valueChange)="onViewModeChange($event)" [variant]="searchPillVariant()" />
  </div>
  </div>

  <div class="px-6 space-y-4">

  @if (showEmptyState()) {
    <lnk-empty-state
      icon="bootstrapInboxes"
      titleKey="GiornaleEventi.Empty.Title"
      [descriptionKey]="hasActiveFilters() ? 'Common.NoResultsForFilters' : 'GiornaleEventi.Empty.Description'"
    />
  } @else {
    @if (viewMode() === 'rows' && rowConfig(); as cfg) {
      <lnk-item-list
        [rows]="rows()"
        [config]="cfg"
        [loading]="loading() && rows().length === 0"
        emptyKey="GiornaleEventi.Empty.Title"
        (rowClick)="onRowClick($any($event))"
      />
    } @else {
      <lnk-data-table
        [columns]="columns()"
        [rows]="rows()"
        [loading]="loading() && rows().length === 0"
        [displayConfig]="rowConfig()"
        emptyKey="GiornaleEventi.Empty.Title"
        (rowClick)="onRowClick($event)"
      />
    }

    @if (hasMore() || loading()) {
      <div
        class="py-4 flex items-center justify-center text-sm text-[var(--muted-foreground)]"
        lnkInfiniteScroll
        [enabled]="canLoadMore()"
        rootMargin="400px"
        (scrolled)="loadMore()"
      >
        @if (loading()) {
          <lnk-loading [inline]="true" size="md" [labelKey]="null" />
        } @else {
          <span>{{ 'Pagination.LoadMoreHint' | translate }}</span>
        }
      </div>
    } @else if (rows().length > 0) {
      <p class="py-3 text-center text-xs text-[var(--muted-foreground)]">
        {{ 'GiornaleEventi.AllLoaded' | translate }}
      </p>
    }
  }
  </div>
</section>
