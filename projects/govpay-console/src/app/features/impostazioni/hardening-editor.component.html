<section class="space-y-4 pb-6 lnk-detail-page">
  <div lnkListStickyToolbar class="px-6 pt-6 pb-4 space-y-3">
    <lnk-page-header titleKey="Impostazioni.Aree.Hardening.Nome" subtitleKey="Impostazioni.Aree.Hardening.Desc">
      <a routerLink="/impostazioni" class="btn btn-secondary btn-sm">
        <ng-icon name="bootstrapChevronLeft" size="1rem" />
        <span>{{ 'Common.Back' | translate }}</span>
      </a>
    </lnk-page-header>
  </div>

  <div class="px-6">
    @if (loading()) {
      <lnk-loading />
    } @else {
      <form [formGroup]="form" (ngSubmit)="save()" class="space-y-4">
        <lnk-detail-section titleKey="Impostazioni.Hardening.ReCaptcha">
          <div class="space-y-5">
            <label class="flex items-center gap-2">
              <input type="checkbox" formControlName="abilitato" class="h-4 w-4 accent-[var(--primary)]" />
              <span class="text-sm">{{ 'Impostazioni.Hardening.Abilitato' | translate }}</span>
            </label>

            <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
              <label class="flex flex-col gap-1 sm:col-span-2">
                <span class="text-xs font-medium text-[var(--muted-foreground)]">{{ 'Impostazioni.Hardening.ServerUrl' | translate }}</span>
                <input type="text" formControlName="serverURL" class="px-3 py-2 rounded border border-[var(--border)] bg-[var(--card-bg)] text-sm font-mono focus:outline-none focus:ring-2 focus:ring-[var(--ring)]" />
              </label>
              <label class="flex flex-col gap-1 sm:col-span-2">
                <span class="text-xs font-medium text-[var(--muted-foreground)]">{{ 'Impostazioni.Hardening.SiteKey' | translate }}</span>
                <input type="text" formControlName="siteKey" class="px-3 py-2 rounded border border-[var(--border)] bg-[var(--card-bg)] text-sm font-mono focus:outline-none focus:ring-2 focus:ring-[var(--ring)]" />
              </label>
              <label class="flex flex-col gap-1">
                <span class="text-xs font-medium text-[var(--muted-foreground)]">{{ 'Impostazioni.Hardening.Soglia' | translate }}</span>
                <input type="number" formControlName="soglia" min="0.1" max="1.0" step="0.1" class="px-3 py-2 rounded border border-[var(--border)] bg-[var(--card-bg)] text-sm font-mono focus:outline-none focus:ring-2 focus:ring-[var(--ring)]" />
              </label>
              <label class="flex flex-col gap-1">
                <span class="text-xs font-medium text-[var(--muted-foreground)]">{{ 'Impostazioni.Hardening.Parametro' | translate }}</span>
                <input type="text" formControlName="parametro" class="px-3 py-2 rounded border border-[var(--border)] bg-[var(--card-bg)] text-sm font-mono focus:outline-none focus:ring-2 focus:ring-[var(--ring)]" />
              </label>
              <label class="flex flex-col gap-1">
                <span class="text-xs font-medium text-[var(--muted-foreground)]">{{ 'Impostazioni.Hardening.ConnTimeout' | translate }}</span>
                <input type="number" formControlName="connectionTimeoutMs" min="0" class="px-3 py-2 rounded border border-[var(--border)] bg-[var(--card-bg)] text-sm font-mono focus:outline-none focus:ring-2 focus:ring-[var(--ring)]" />
              </label>
              <label class="flex flex-col gap-1">
                <span class="text-xs font-medium text-[var(--muted-foreground)]">{{ 'Impostazioni.Hardening.ReadTimeout' | translate }}</span>
                <input type="number" formControlName="readTimeoutMs" min="0" class="px-3 py-2 rounded border border-[var(--border)] bg-[var(--card-bg)] text-sm font-mono focus:outline-none focus:ring-2 focus:ring-[var(--ring)]" />
              </label>
            </div>

            <label class="flex items-center gap-2">
              <input type="checkbox" formControlName="denyOnFail" class="h-4 w-4 accent-[var(--primary)]" />
              <span class="text-sm">{{ 'Impostazioni.Hardening.DenyOnFail' | translate }}</span>
            </label>
          </div>
        </lnk-detail-section>

        <lnk-form-action-bar>
          <button type="submit" class="btn btn-primary btn-sm" [disabled]="saving()">{{ 'Common.Save' | translate }}</button>
          <a routerLink="/impostazioni" class="btn btn-ghost btn-sm">{{ 'Common.Cancel' | translate }}</a>
        </lnk-form-action-bar>
      </form>

      <div class="mt-4">
        <lnk-set-password-card [submit]="submitSecret" titleKey="Impostazioni.Hardening.SecretKey" />
      </div>
    }
  </div>
</section>
