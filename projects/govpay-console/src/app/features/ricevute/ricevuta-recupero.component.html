<div class="rounded-lg border border-[var(--border)] bg-[var(--card-bg)] p-4 space-y-3">
  <div class="flex items-center justify-between">
    <h3 class="text-sm font-semibold">{{ 'Ricevute.Recupero.Titolo' | translate }}</h3>
    <button type="button" class="btn btn-ghost btn-icon btn-sm" (click)="onCancel()" [attr.aria-label]="'Common.Close' | translate">
      <ng-icon name="bootstrapX" size="1.1rem" />
    </button>
  </div>

  <div class="flex flex-wrap items-end gap-3">
    <label class="flex flex-col gap-1 text-sm">
      <span class="text-[var(--muted-foreground)]">
        {{ 'Ricevute.Recupero.IdDominio' | translate }} <span class="text-[var(--danger)]">*</span>
      </span>
      <input type="text" inputmode="numeric" maxlength="11"
        [ngModel]="idDominio()" (ngModelChange)="idDominio.set($event)"
        [placeholder]="'Ricevute.Recupero.IdDominioPlaceholder' | translate"
        class="rounded border border-[var(--border)] bg-[var(--card-bg)] px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-[var(--ring)] min-w-[10rem]" />
    </label>

    <label class="flex flex-col gap-1 text-sm">
      <span class="text-[var(--muted-foreground)]">
        {{ 'Ricevute.Recupero.Iuv' | translate }} <span class="text-[var(--danger)]">*</span>
      </span>
      <input type="text"
        [ngModel]="iuv()" (ngModelChange)="iuv.set($event)"
        [placeholder]="'Ricevute.Recupero.IuvPlaceholder' | translate"
        class="rounded border border-[var(--border)] bg-[var(--card-bg)] px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-[var(--ring)] min-w-[14rem]" />
    </label>

    <label class="flex flex-col gap-1 text-sm">
      <span class="text-[var(--muted-foreground)]">
        {{ 'Ricevute.Recupero.IdRicevuta' | translate }} <span class="text-[var(--danger)]">*</span>
      </span>
      <input type="text"
        [ngModel]="idRicevuta()" (ngModelChange)="idRicevuta.set($event)"
        [placeholder]="'Ricevute.Recupero.IdRicevutaPlaceholder' | translate"
        class="rounded border border-[var(--border)] bg-[var(--card-bg)] px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-[var(--ring)] min-w-[12rem]" />
    </label>
  </div>

  @if (idDominio() && !dominioValido()) {
    <p class="text-xs text-[var(--danger)]">{{ 'Ricevute.Recupero.IdDominioNonValido' | translate }}</p>
  }

  <p class="text-xs text-[var(--muted-foreground)]">{{ 'Ricevute.Recupero.Hint' | translate }}</p>

  <div class="flex items-center gap-2">
    <button type="button" class="btn btn-primary btn-sm" (click)="submit()" [disabled]="!canSubmit()">
      <ng-icon name="bootstrapArrowClockwise" size="1rem" />
      <span>{{ (submitting() ? 'Ricevute.Recupero.InCorso' : 'Ricevute.Recupero.Invia') | translate }}</span>
    </button>
    <button type="button" class="btn btn-ghost btn-sm" (click)="onCancel()">{{ 'Common.Cancel' | translate }}</button>
  </div>
</div>
