@if (!open()) {
  <button type="button" class="btn btn-secondary btn-sm" (click)="toggle(true)">
    {{ titleKey() | translate }}
  </button>
} @else {
  <form [formGroup]="form" autocomplete="off" class="rounded-lg border border-[var(--border)] bg-[var(--card-bg)] p-4 space-y-3 max-w-md">
    <div class="text-sm font-semibold">{{ titleKey() | translate }}</div>
    <p class="text-xs text-[var(--muted-foreground)]">{{ 'Password.PolicyHint' | translate }}</p>

    <label class="flex flex-col gap-1">
      <span class="text-xs font-medium text-[var(--muted-foreground)]">{{ 'Password.Nuova' | translate }}</span>
      <input type="password" formControlName="nuovaPassword" autocomplete="new-password"
        class="px-3 py-2 rounded border border-[var(--border)] bg-[var(--card-bg)] text-sm focus:outline-none focus:ring-2 focus:ring-[var(--ring)]" />
      @if (form.controls.nuovaPassword.touched && form.controls.nuovaPassword.hasError('policy')) {
        <span class="text-xs text-[var(--status-danger-text)]">{{ 'Password.PolicyErrore' | translate }}</span>
      }
    </label>

    <label class="flex flex-col gap-1">
      <span class="text-xs font-medium text-[var(--muted-foreground)]">{{ 'Password.Conferma' | translate }}</span>
      <input type="password" formControlName="conferma" autocomplete="new-password"
        class="px-3 py-2 rounded border border-[var(--border)] bg-[var(--card-bg)] text-sm focus:outline-none focus:ring-2 focus:ring-[var(--ring)]" />
      @if (form.controls.conferma.touched && form.hasError('mismatch')) {
        <span class="text-xs text-[var(--status-danger-text)]">{{ 'Password.NonCoincidono' | translate }}</span>
      }
    </label>

    <div class="flex items-center gap-2">
      <button type="button" class="btn btn-primary btn-sm" (click)="save()" [disabled]="saving() || form.invalid">{{ 'Common.Save' | translate }}</button>
      <button type="button" class="btn btn-ghost btn-sm" (click)="toggle(false)" [disabled]="saving()">{{ 'Common.Cancel' | translate }}</button>
    </div>
  </form>
}
