##############################################################################
# GovPay Console - docker compose
#
# Espone la console su http://localhost:10012 (cambia la porta host sotto se
# la 10012 è già occupata).
#
# Avvio (build dai sorgenti):
#   docker compose up --build
#
# Per usare l'immagine già pubblicata dalla pipeline invece del build locale:
#   commenta il blocco "build:" e decommenta la riga "image: linkitaly/...".
#
# --- Collegare il backend dei servizi (API GovPay) ---
# La console chiama /govpay-console-api. Due modi per puntarlo al backend:
#
#   1) Reverse proxy nginx (consigliato, niente CORS) -> GOVPAY_API_BACKEND:
#      nginx inoltra /govpay-console-api verso
#      ${GOVPAY_API_BACKEND}/govpay/console-api. Lascia GOVAPI.GOVPAY uguale
#      a "/govpay-console-api" in app-config.json.
#
#   2) Override della configurazione runtime -> volume su app-config.json:
#      monta un file personalizzato per cambiare GOVAPI.GOVPAY (o altri
#      parametri) senza ricostruire l'immagine.
##############################################################################

services:
  govpay-console:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: govpay-console:local
    # In alternativa al build locale, usa l'immagine pubblicata:
    #   commenta il blocco "build:" qui sopra e decommenta la riga seguente.
    # image: linkitaly/govpay-console:4.0.0
    container_name: govpay-console
    ports:
      - "10012:8080"           # host:container -> http://localhost:10012
    environment:
      SERVER_PORT: 8080
      # Base path da cui e' servita la console. Scommenta per esporla sotto un
      # prefisso invece che alla radice, es. http://localhost:10012/govpay-console/
      # GOVPAY_CONSOLE_BASE_PATH: /govpay-console
      # Backend dei servizi: nginx fa da reverse proxy per /govpay-console-api.
      # Sostituisci con l'URL del tuo backend GovPay.
      GOVPAY_API_BACKEND: https://lab.link.it
    # Override della configurazione runtime della console (opzionale).
    # Decommenta per sostituire app-config.json, ad es. per impostare
    # GOVAPI.GOVPAY, gli URL di IAM/PagoPA, il theming, ecc.
    # volumes:
    #   - ./app-config.json:/usr/share/nginx/html/assets/config/app-config.json:ro
    restart: unless-stopped
